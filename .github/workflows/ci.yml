name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.18.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.node-version'
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Export patched dependency lockfile for review (temporary)
        run: |
          echo JFA_LOCK_START
          base64 -w76 pnpm-lock.yaml
          echo JFA_LOCK_END
      - name: Dependency audit (high and critical advisories)
        run: pnpm audit --audit-level high
      - name: Dependency license inventory
        run: pnpm licenses list --json > /tmp/jfa-license-inventory.json
      - name: Secret scanner
        run: pnpm scan:secrets
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Typecheck web and worker
        run: pnpm typecheck
      - name: Build public web
        run: pnpm build
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jfa_ci
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: jfa_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jfa_ci -d jfa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise migration, replay, synthetic seed and constraints
        env:
          PGPASSWORD: local_test_only
        run: |
          psql -h localhost -U jfa_ci -d jfa_ci -v ON_ERROR_STOP=1 -f db/migrations/0001_core.sql
          psql -h localhost -U jfa_ci -d jfa_ci -v ON_ERROR_STOP=1 -f db/migrations/0001_core.sql
          psql -h localhost -U jfa_ci -d jfa_ci -v ON_ERROR_STOP=1 -f db/seeds/0001_demo.sql
          psql -h localhost -U jfa_ci -d jfa_ci -v ON_ERROR_STOP=1 -f db/tests/001_schema_assertions.sql
